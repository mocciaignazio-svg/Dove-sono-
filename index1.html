<!DOCTYPE html>
<html>
<body>
    <button onclick="testDati()">Testa Collegamento</button>
    <div id="risultato"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbySJBpVCUT_manCmfSlbIzuJioSfbGEHxgxb6rMIDEiuc75cw36c66WcPOCK9L-Fbw/exec";
        
        async function testDati() {
            document.getElementById("risultato").innerText = "Caricamento...";
            try {
                const res = await fetch(API_URL + "?sheet=CLASSI");
                const data = await res.json();
                document.getElementById("risultato").innerText = JSON.stringify(data);
            } catch (e) {
                document.getElementById("risultato").innerText = "Errore: " + e;
            }
        }
    </script>
</body>
</html>
