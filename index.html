<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dove sono?</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #00fa9a; --accent: #66cdaa; --bg-app: #f0f2f5; }
        body { font-family: sans-serif; background-color: var(--bg-app); margin: 0; padding: 20px; color: #333; }
        .wrapper { max-width: 1000px; margin: 0 auto; }
        
        /* Classe per evidenziare l'ora */
        .ora-attiva { background-color: #3498db !important; color: white !important; font-weight: bold; }
        
        /* Menu a scorrimento orizzontale */
        #menu { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        #menu::-webkit-scrollbar { display: none; }
        #menu button { flex: 0 0 auto; min-width: 100px; transition: background 0.3s; }
        #menu button.active { background-color: var(--accent); }

        .controls { margin: 20px 0; padding: 15px; background: rgba(255,255,255,0.6); border-radius: 10px; display: flex; flex-wrap: wrap; gap: 10px; }
        button { padding: 10px 15px; border: none; border-radius: 6px; background-color: var(--primary); color: white; cursor: pointer; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; font-size: 12px; }
        th, td { padding: 8px; border: 1px solid #ddd; text-align: center; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2 id="titolo-giorno">📅 Caricamento...</h2>
    <div id="menu">
        <button onclick="selezionaMenu(this, 'CLASSI', 'NOME_CLASSE')">Classi</button>
        <button onclick="selezionaMenu(this, 'DOCENTI', 'NOME_DOCENTE')">Docenti</button>
        <button onclick="selezionaMenu(this, 'AULE', 'NOME_AULA')">Aule</button>
        <button onclick="selezionaMenu(this, 'MATERIE', 'NOME_MATERIA')">Materie</button>
    </div>

    <div class="controls">
        <select id="select-valore" onchange="gestisciSelezione()"><option value="">-- Seleziona --</option></select>
        <button onclick="mostraSettimanale()">Orario Sett.</button>
    </div>
    <div id="tabella"></div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbySJBpVCUT_manCmfSlbIzuJioSfbGEHxgxb6rMIDEiuc75cw36c66WcPOCK9L-Fbw/exec";
    let tipoCorrente = "";
    const oggi = new Date();
    const giorniMappa = { "Domenica": "DOM", "Lunedì": "LUN", "Martedì": "MAR", "Mercoledì": "MER", "Giovedì": "GIO", "Venerdì": "VEN", "Sabato": "SAB" };
    const nomeGiornoCompleto = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"][oggi.getDay()];
    document.getElementById("titolo-giorno").innerHTML = `📅 Oggi: <b>${nomeGiornoCompleto}</b>`;

    function evidenziaOraCorrente() {
        const now = new Date();
        const ora = now.getHours();
        const min = now.getMinutes();
        const giorniSettimana = ["DOM", "LUN", "MAR", "MER", "GIO", "VEN", "SAB"];
        const gOggi = giorniSettimana[now.getDay()]; // Es: "GIO"
        
        let oraScolastica = 0;
        if (ora === 8 && min >= 15) oraScolastica = 1;
        else if (ora === 9 && min < 15) oraScolastica = 1;
        else if (ora === 9 && min >= 15) oraScolastica = 2;
        else if (ora === 10 && min < 15) oraScolastica = 2;
        else if (ora === 10 && min >= 15) oraScolastica = 3;
        else if (ora === 11 && min < 15) oraScolastica = 3;
        else if (ora === 11 && min >= 15) oraScolastica = 4;
        else if (ora === 12 && min < 15) oraScolastica = 4;
        else if (ora === 12 && min >= 15) oraScolastica = 5;

        if (oraScolastica === 0) return; // Fuori orario scolastico

        const tabelle = document.querySelectorAll('table');
        tabelle.forEach(tabella => {
            const intestazioni = tabella.querySelectorAll('th');
            let indiceGiorno = -1;

            // Trova l'indice della colonna del giorno corrente
            intestazioni.forEach((th, index) => {
                if (th.innerText === gOggi) indiceGiorno = index;
            });

            const righe = tabella.querySelectorAll('tr');
            righe.forEach(riga => {
                const celle = riga.querySelectorAll('td');
                // Se è la vista singola (ha solo celle ORA, AULA/CLASSE, ecc.)
                if (celle.length > 0 && indiceGiorno === -1) {
                    if (parseInt(celle[0].innerText) === oraScolastica) {
                        riga.classList.add('ora-attiva');
                    }
                } 
                // Se è la vista settimanale (ha indiceGiorno valido)
                else if (indiceGiorno !== -1 && celle.length > 0) {
                    if (parseInt(celle[0].innerText) === oraScolastica) {
                        celle[indiceGiorno].classList.add('ora-attiva');
                    }
                }
            });
        });
    }

    function selezionaMenu(btn, foglio, colonna) {
        document.querySelectorAll('#menu button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        caricaMenu(foglio, colonna);
    }

    async function caricaMenu(foglio, colonna) {
        tipoCorrente = foglio;
        const res = await fetch(`${API_URL}?sheet=${foglio}`);
        const data = await res.json();
        let select = document.getElementById('select-valore');
        select.innerHTML = '<option value="">-- Seleziona --</option>';
        data.forEach(item => { if(item[colonna]) select.innerHTML += `<option value="${item[colonna]}">${item[colonna]}</option>`; });
    }

    function gestisciSelezione() {
        const valore = document.getElementById('select-valore').value;
        if (valore) mostraOrario(valore, tipoCorrente);
    }

    async function mostraOrario(valore, tipo) {
        const res = await fetch(`${API_URL}?sheet=ORARIO`);
        const data = await res.json();
        let filtroCampo = (tipo === 'CLASSI') ? 'CLASSE' : (tipo === 'DOCENTI') ? 'DOCENTE' : (tipo === 'AULE') ? 'AULA' : 'MATERIA';
        let filtrati = data.filter(r => r[filtroCampo] == valore && r.GIORNO == giorniMappa[nomeGiornoCompleto]);
        filtrati.sort((a, b) => a.ORA - b.ORA);
        
        let html = `<h3>${valore}</h3><table><tr><th>ORA</th>`;
        if (tipo === 'CLASSI') html += `<th>AULA</th><th>MATERIA</th><th>DOCENTE</th></tr>`;
        else if (tipo === 'DOCENTI') html += `<th>CLASSE</th><th>AULA</th><th>MATERIA</th></tr>`;
        else if (tipo === 'AULE') html += `<th>CLASSE</th><th>DOCENTE</th><th>MATERIA</th></tr>`;
        else html += `<th>CLASSE</th><th>DOCENTE</th><th>AULA</th></tr>`;

        filtrati.forEach(r => {
            html += `<tr><td>${r.ORA}</td>` + 
                    ((tipo === 'CLASSI') ? `<td>${r.AULA}</td><td>${r.MATERIA}</td><td>${r.DOCENTE}</td>` :
                     (tipo === 'DOCENTI') ? `<td>${r.CLASSE}</td><td>${r.AULA}</td><td>${r.MATERIA}</td>` :
                     (tipo === 'AULE') ? `<td>${r.CLASSE}</td><td>${r.DOCENTE}</td><td>${r.MATERIA}</td>` :
                     `<td>${r.CLASSE}</td><td>${r.DOCENTE}</td><td>${r.AULA}</td>`) + `</tr>`;
        });
        document.getElementById('tabella').innerHTML = html + `</table>`;
        evidenziaOraCorrente();
    }

    async function mostraSettimanale() {
        const valore = document.getElementById('select-valore').value;
        if (!valore) return alert("Seleziona una voce!");
        const res = await fetch(`${API_URL}?sheet=ORARIO`);
        const data = await res.json();
        const giorni = ['LUN', 'MAR', 'MER', 'GIO', 'VEN', 'SAB'];
        let filtroCampo = (tipoCorrente === 'CLASSI') ? 'CLASSE' : (tipoCorrente === 'DOCENTI') ? 'DOCENTE' : (tipoCorrente === 'AULE') ? 'AULA' : 'MATERIA';
        
        let html = `<h3>${valore}</h3><table><tr><th>ORA</th>` + giorni.map(g => `<th>${g}</th>`).join('') + `</tr>`;
        for (let ora = 1; ora <= 6; ora++) {
            html += `<tr><td>${ora}</td>` + giorni.map(g => {
                const r = data.find(item => item[filtroCampo] === valore && item.GIORNO === g && item.ORA == ora);
                if (!r) return `<td>-</td>`;
                if (tipoCorrente === 'CLASSI') return `<td>${r.DOCENTE}<br><b>${r.MATERIA}</b><br><small>${r.AULA}</small></td>`;
                if (tipoCorrente === 'DOCENTI') return `<td>${r.MATERIA}<br><b>${r.CLASSE}</b><br><small>${r.AULA}</small></td>`;
                if (tipoCorrente === 'AULE') return `<td>${r.DOCENTE}<br><b>${r.MATERIA}</b><br><small>${r.CLASSE}</small></td>`;
                return `<td>${r.DOCENTE}<br><b>${r.CLASSE}</b><br><small>${r.AULA}</small></td>`;
            }).join('') + `</tr>`;
        }
        document.getElementById('tabella').innerHTML = html + `</table>`;
        evidenziaOraCorrente();
    }
</script>
</body>
</html>
