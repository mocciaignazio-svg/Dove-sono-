<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dove sono?</title>
    
    <link rel="manifest" href="/AppOrario/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Dove sono?">
    <link rel="apple-touch-icon" href="/AppOrario/logo.png">

    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg-app: #f0f2f5; }
        body { font-family: sans-serif; background-color: var(--bg-app); margin: 0; padding: 20px; color: #333; }
        .wrapper { max-width: 1000px; margin: 0 auto; background: transparent; padding: 0; }
        .logo-container { text-align: center; margin-bottom: 20px; }
        img { max-width: 150px; height: auto; }
        h2, h3 { color: var(--primary); }
        .controls { margin: 20px 0; padding: 15px; background: rgba(255,255,255,0.6); border-radius: 10px; display: flex; flex-wrap: wrap; gap: 10px; }
        button { padding: 10px 15px; border: none; border-radius: 6px; background-color: var(--primary); color: white; cursor: pointer; font-weight: 600; }
        select { padding: 10px; border-radius: 6px; border: 1px solid #ced4da; flex-grow: 1; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; }
        td, th { padding: 12px; border-bottom: 1px solid #edf2f7; text-align: center; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="logo-container">
        <img src="/AppOrario/logo.png" alt="Logo">
    </div>
    
    <h2 id="titolo-giorno">📅 Caricamento...</h2>
    
    <div id="menu" style="display:flex; gap: 5px; flex-wrap: wrap;">
        <button onclick="caricaMenu('CLASSI', 'NOME_CLASSE')">Classi</button>
        <button onclick="caricaMenu('DOCENTI', 'NOME_DOCENTE')">Docenti</button>
        <button onclick="caricaMenu('AULE', 'NOME_AULA')">Aule</button>
    </div>

    <div class="controls">
        <select id="select-valore" onchange="gestisciSelezione()">
            <option value="">-- Seleziona --</option>
        </select>
        <button onclick="mostraSettimanale()">Orario Sett.</button>
    </div>

    <div id="tabella"></div>
</div>

<script>
    // Percorso corretto del Service Worker
    if ('serviceWorker' in navigator) { 
        navigator.serviceWorker.register('/AppOrario/sw.js').catch(console.error); 
    }

    const giorniMappa = { "Domenica": "DOM", "Lunedì": "LUN", "Martedì": "MAR", "Mercoledì": "MER", "Giovedì": "GIO", "Venerdì": "VEN", "Sabato": "SAB" };
    const oggi = new Date();
    const nomeGiornoCompleto = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"][oggi.getDay()];
    const giornoBreve = giorniMappa[nomeGiornoCompleto];
    document.getElementById("titolo-giorno").innerHTML = `📅 Oggi è ${nomeGiornoCompleto}`;

    const API_URL = "https://sheetdb.io/api/v1/qpihr1i6cw6jf";
    let tipoCorrente = "";

    async function caricaMenu(foglio, colonna) {
        tipoCorrente = foglio;
        const res = await fetch(`${API_URL}?sheet=${foglio}`);
        const data = await res.json();
        let select = document.getElementById('select-valore');
        select.innerHTML = '<option value="">-- Seleziona --</option>';
        data.forEach(item => select.innerHTML += `<option value="${item[colonna]}">${item[colonna]}</option>`);
    }

    function gestisciSelezione() {
        const valore = document.getElementById('select-valore').value;
        if (valore) mostraOrario(valore, tipoCorrente);
    }

    async function mostraOrario(valore, tipo) {
        const res = await fetch(`${API_URL}?sheet=ORARIO`);
        const data = await res.json();
        let filtroCampo = (tipo === 'CLASSI') ? 'CLASSE' : (tipo === 'DOCENTI') ? 'DOCENTE' : 'AULA';
        let filtrati = data.filter(r => r[filtroCampo] == valore && r.GIORNO == giornoBreve);
        filtrati.sort((a, b) => a.ORA - b.ORA);
        
        let html = `<h3>${valore}</h3><table>`;
        filtrati.forEach(r => html += `<tr><td>${r.ORA}</td><td>${r.MATERIA}</td></tr>`);
        document.getElementById('tabella').innerHTML = html + `</table>`;
    }
</script>
</body>
</html>
