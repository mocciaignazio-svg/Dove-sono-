<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dove sono?</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg-app: #f0f2f5; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-app); margin: 0; padding: 20px; color: #333; }
        .wrapper { max-width: 1000px; margin: 0 auto; }
        .controls { margin: 20px 0; padding: 15px; background: rgba(255,255,255,0.6); border-radius: 10px; display: flex; flex-wrap: wrap; gap: 10px; }
        button { padding: 10px 15px; border: none; border-radius: 6px; background-color: var(--primary); color: white; cursor: pointer; font-weight: 600; }
        button:hover { background-color: var(--accent); }
        select { padding: 10px; border-radius: 6px; border: 1px solid #ced4da; flex-grow: 1; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; font-size: 13px; }
        th { background-color: #f8f9fa; padding: 10px; text-transform: uppercase; font-size: 10px; }
        td { padding: 10px; border-bottom: 1px solid #edf2f7; text-align: center; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2 id="titolo-giorno">📅 Caricamento...</h2>
    <div id="menu" style="display:flex; gap: 5px; flex-wrap: wrap;">
        <button onclick="caricaMenu('CLASSI', 'NOME_CLASSE')">Classi</button>
        <button onclick="caricaMenu('DOCENTI', 'NOME_DOCENTE')">Docenti</button>
        <button onclick="caricaMenu('AULE', 'NOME_AULA')">Aule</button>
        <button onclick="caricaMenu('MATERIE', 'NOME_MATERIA')">Materie</button>
    </div>

    <div class="controls">
        <select id="select-valore" onchange="gestisciSelezione()">
            <option value="">-- Seleziona --</option>
        </select>
        <button onclick="mostraSettimanale()">Orario Sett.</button>
    </div>
    <div id="tabella"></div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbySJBpVCUT_manCmfSlbIzuJioSfbGEHxgxb6rMIDEiuc75cw36c66WcPOCK9L-Fbw/exec";
    let tipoCorrente = "";
    
    const oggi = new Date();
    const giorniMappa = { "Domenica": "DOM", "Lunedì": "LUN", "Martedì": "MAR", "Mercoledì": "MER", "Giovedì": "GIO", "Venerdì": "VEN", "Sabato": "SAB" };
    const nomeGiornoCompleto = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"][oggi.getDay()];
    document.getElementById("titolo-giorno").innerHTML = `📅 Oggi è <b>${nomeGiornoCompleto}</b>`;

    async function caricaMenu(foglio, colonna) {
        tipoCorrente = foglio;
        const res = await fetch(`${API_URL}?sheet=${foglio}`);
        const data = await res.json();
        let select = document.getElementById('select-valore');
        select.innerHTML = '<option value="">-- Seleziona --</option>';
        data.forEach(item => { if(item[colonna]) select.innerHTML += `<option value="${item[colonna]}">${item[colonna]}</option>`; });
    }

    function gestisciSelezione() {
        const valore = document.getElementById('select-valore').value;
        if (valore) mostraOrario(valore, tipoCorrente);
    }

    async function mostraOrario(valore, tipo) {
        const res = await fetch(`${API_URL}?sheet=ORARIO`);
        const data = await res.json();
        
        let filtroCampo = (tipo === 'CLASSI') ? 'CLASSE' : (tipo === 'DOCENTI') ? 'DOCENTE' : (tipo === 'AULE') ? 'AULA' : 'MATERIA';
        let giornoBreve = giorniMappa[nomeGiornoCompleto];
        
        let filtrati = data.filter(r => r[filtroCampo] == valore && r.GIORNO == giornoBreve);
        filtrati.sort((a, b) => a.ORA - b.ORA);
        
        let html = `<h3>${valore}</h3><table><tr><th>ORA</th><th>DETTAGLI</th></tr>`;
        
        if (filtrati.length === 0) {
            html += `<tr><td colspan="2">Nessuna lezione oggi.</td></tr>`;
        } else {
            filtrati.forEach(r => {
                let info = "";
                if (tipo === 'CLASSI') {
                    info = `${r.DOCENTE} - ${r.MATERIA} (${r.AULA})`;
                } else if (tipo === 'DOCENTI') {
                    info = `${r.CLASSE} - ${r.MATERIA} (${r.AULA})`;
                } else if (tipo === 'AULE') {
                    info = `${r.CLASSE} - ${r.DOCENTE} - ${r.MATERIA}`;
                } else if (tipo === 'MATERIE') {
                    info = `Classe: <b>${r.CLASSE}</b> | Docente: ${r.DOCENTE} | Aula: ${r.AULA}`;
                }
                html += `<tr><td>${r.ORA}</td><td>${info}</td></tr>`;
            });
        }
        document.getElementById('tabella').innerHTML = html + `</table>`;
    }

    async function mostraSettimanale() {
        const valore = document.getElementById('select-valore').value;
        if (!valore) { alert("Seleziona prima una voce!"); return; }
        
        const res = await fetch(`${API_URL}?sheet=ORARIO`);
        const data = await res.json();
        const giorni = ['LUN', 'MAR', 'MER', 'GIO', 'VEN', 'SAB'];
        let filtroCampo = (tipoCorrente === 'CLASSI') ? 'CLASSE' : (tipoCorrente === 'DOCENTI') ? 'DOCENTE' : (tipoCorrente === 'AULE') ? 'AULA' : 'MATERIA';
        
        let html = `<h3>${valore}</h3><table><tr><th>ORA</th>` + giorni.map(g => `<th>${g}</th>`).join('') + `</tr>`;
        for (let ora = 1; ora <= 6; ora++) {
            html += `<tr><td>${ora}</td>` + giorni.map(g => {
                const lez = data.find(r => r[filtroCampo] === valore && r.GIORNO === g && r.ORA == ora);
                return `<td>${lez ? lez.MATERIA : "-"}</td>`;
            }).join('') + `</tr>`;
        }
        document.getElementById('tabella').innerHTML = html + `</table>`;
    }
</script>
</body>
</html>
