<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dove sono?</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Dove sono?">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg-app: #f0f2f5; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-app); 
            margin: 0; 
            padding: 20px; 
            color: #333; 
        }

        .wrapper { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: transparent; 
            padding: 0; 
        }

        h2, h3 { color: var(--primary); }
        .giorno-evidenziato { color: var(--accent); font-weight: bold; }
        
        .controls { 
            margin: 20px 0; 
            padding: 15px; 
            background: rgba(255,255,255,0.6); 
            border-radius: 10px; 
            border: 1px solid rgba(0,0,0,0.05); 
            display: flex; 
            flex-wrap: wrap; 
            align-items: center; 
            gap: 10px; 
        }

        button { padding: 10px 15px; border: none; border-radius: 6px; background-color: var(--primary); color: white; cursor: pointer; font-weight: 600; }
        button:hover { background-color: var(--accent); }
        select { padding: 10px; border-radius: 6px; border: 1px solid #ced4da; font-size: 14px; flex-grow: 1; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; font-size: 14px; }
        th { background-color: #f8f9fa; color: #495057; padding: 12px; text-transform: uppercase; font-size: 11px; }
        td { padding: 12px; border-bottom: 1px solid #edf2f7; text-align: center; }
        tr:hover { background-color: #f1f7fd; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2 id="titolo-giorno">📅 Caricamento...</h2>
    
    <div id="menu" style="display:flex; gap: 5px; flex-wrap: wrap;">
        <button onclick="caricaMenu('CLASSI', 'NOME_CLASSE')">Classi</button>
        <button onclick="caricaMenu('DOCENTI', 'NOME_DOCENTE')">Docenti</button>
        <button onclick="caricaMenu('AULE', 'NOME_AULA')">Aule</button>
        <button onclick="caricaMenu('MATERIE', 'NOME_MATERIA')">Materie</button>
    </div>

    <div class="controls" id="pannello-controllo">
        <select id="select-valore" onchange="gestisciSelezione()">
            <option value="">-- Seleziona --</option>
        </select>
        <button onclick="mostraSettimanale()">Orario Sett.</button>
    </div>

    <div id="tabella"></div>
</div>

<script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(console.error); }

    const giorniMappa = { "Domenica": "DOM", "Lunedì": "LUN", "Martedì": "MAR", "Mercoledì": "MER", "Giovedì": "GIO", "Venerdì": "VEN", "Sabato": "SAB" };
    const oggi = new Date();
    const nomeGiornoCompleto = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"][oggi.getDay()];
    const giornoBreve = giorniMappa[nomeGiornoCompleto];
    
    document.getElementById("titolo-giorno").innerHTML = `📅 Oggi è <span class="giorno-evidenziato">${nomeGiornoCompleto}</span>`;

    // INSERISCI QUI SOTTO IL TUO URL DI GOOGLE APPS SCRIPT
    const API_URL = "https://script.google.com/macros/s/AKfycbySJBpVCUT_manCmfSlbIzuJioSfbGEHxgxb6rMIDEiuc75cw36c66WcPOCK9L-Fbw/exec"; 
    let tipoCorrente = "";

    async function caricaMenu(foglio, colonna) {
        tipoCorrente = foglio;
        const res = await fetch(`${API_URL}?sheet=${foglio}`);
        const data = await res.json();
        let select = document.getElementById('select-valore');
        select.innerHTML = '<option value="">-- Seleziona --</option>';
        data.forEach(item => {
            if(item[colonna]) select.innerHTML += `<option value="${item[colonna]}">${item[colonna]}</option>`;
        });
    }

    function gestisciSelezione() {
        const valore = document.getElementById('select-valore').value;
        if (valore) mostraOrario(valore, tipoCorrente);
    }

    async function mostraOrario(valore, tipo) {
        const res = await fetch(`${API_URL}?sheet=ORARIO`);
        const data = await res.json();
        let filtroCampo = (tipo === 'CLASSI') ? 'CLASSE' : (tipo === 'DOCENTI') ? 'DOCENTE' : 'AULA';
        
        let filtrati = data.filter(r => r[filtroCampo] == valore && r.GIORNO == giornoBreve);
        filtrati.sort((a, b) => a.ORA - b.ORA);
        
        let header = "<th>ORA</th>";
        if (tipo === 'CLASSI') header += "<th>DOCENTE</th><th>AULA</th><th>MATERIA</th>";
        else if (tipo === 'DOCENTI') header += "<th>CLASSE</th><th>AULA</th><th>MATERIA</th>";
        else header += "<th>CLASSE</th><th>DOCENTE</th><th>MATERIA</th>";

        let html = `<h3>${valore}</h3><table><tr>${header}</tr>`;
        
        if (filtrati.length === 0) html += `<tr><td colspan="4">Nessuna lezione.</td></tr>`;
        else {
            filtrati.forEach(r => {
                html += `<tr><td>${r.ORA}</td>`;
                if (tipo === 'CLASSI') html += `<td>${r.DOCENTE}</td><td>${r.AULA}</td><td>${r.MATERIA}</td>`;
                else if (tipo === 'DOCENTI') html += `<td>${r.CLASSE}</td><td>${r.AULA}</td><td>${r.MATERIA}</td>`;
                else html += `<td>${r.CLASSE}</td><td>${r.DOCENTE}</td><td>${r.MATERIA}</td>`;
                html += `</tr>`;
            });
        }
        document.getElementById('tabella').innerHTML = html + `</table>`;
    }

    async function mostraSettimanale() {
        const valore = document.getElementById('select-valore').value;
        if (!valore) { alert("Seleziona prima una voce!"); return; }
        
        const res = await fetch(`${API_URL}?sheet=ORARIO`);
        const data = await res.json();
        const giorni = ['LUN', 'MAR', 'MER', 'GIO', 'VEN', 'SAB'];
        
        let html = `<h3>${valore}</h3><table><tr><th>ORA</th>` + giorni.map(g => `<th>${g}</th>`).join('') + `</tr>`;
        
        for (let ora = 1; ora <= 6; ora++) {
            html += `<tr><td>${ora}</td>`;
            giorni.forEach(g => {
                let filtroCampo = (tipoCorrente === 'CLASSI') ? 'CLASSE' : (tipoCorrente === 'DOCENTI') ? 'DOCENTE' : 'AULA';
                const lez = data.find(r => r[filtroCampo] === valore && r.GIORNO === g && r.ORA == ora);
                let cella = "-";
                if (lez) {
                    if (tipoCorrente === 'CLASSI') cella = lez.DOCENTE + "<br><b>" + lez.MATERIA + "</b><br><small>(" + lez.AULA + ")</small>";
                    else if (tipoCorrente === 'DOCENTI') cella = lez.CLASSE + "<br><b>" + lez.MATERIA + "</b><br><small>(" + lez.AULA + ")</small>";
                    else cella = lez.CLASSE + "<br>" + lez.DOCENTE + "<br><b>" + lez.MATERIA + "</b>";
                }
                html += `<td>${cella}</td>`;
            });
            html += `</tr>`;
        }
        document.getElementById('tabella').innerHTML = html + `</table>`;
    }
</script>
</body>
</html>
